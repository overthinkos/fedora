#  Per-kind file for vm entries. Sibling of charly.yml — imported via its
#  `import:` list. The schema kind discriminator is `kind: vm`; root-shape map is
#  `vm:` (this file).
version: 2026.159.3
vm:
    # Disposable Fedora Cloud VM — the substrate for eval-fedora-vm, which proves
    # the rpm localpkg AUTO-RESOLVE deploy path (build the opencharly .rpm in a
    # fedora container, dnf install onto the guest, mandatory deps auto-resolved).
    fedora-vm:
        source:
            kind: cloud_image
            url: https://download.fedoraproject.org/pub/fedora/linux/releases/43/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-43-1.6.x86_64.qcow2
            checksum:
                type: sha256
            base_user: fedora
        backend: libvirt
        disk_size: 20G
        ram: 4G
        cpu: 2
        machine: q35
        firmware: bios
        ssh:
            port_auto: true
            key_source: generate
        cloud_init:
            timezone: UTC
            package:
                - sudo
