#  overthinkos/fedora — the Fedora image-family showcase, split out of the main
#  overthink repo (2026-05). Mounted as a git submodule at image/fedora.
#
#  SINGLE-FILE config (2026-05 import-namespace cutover): every local entity
#  (the Fedora consumer showcase images — fedora-coder / fedora-ov / fedora-test)
#  is inlined here. This repo VENDORS NOTHING — every layer is an
#  `@github.com/...` ref, the shared build-config (distro/builder/init) arrives
#  via a flat `import:`, and the main repo's Fedora base stack arrives via the
#  namespaced `ov` import.
#
#  Unlike debian/ubuntu (whose bases moved entirely) and like arch/cachyos, the
#  Fedora base STAYS in the main repo: fedora is the ecosystem default base (~40
#  main images root on fedora/fedora-nonfree, and fedora-builder is main's
#  defaults.builder), so the base stack (fedora + fedora-builder + fedora-nonfree)
#  lives in the main repo's base.yml. It is reached here by importing main under
#  the `ov` namespace (`ov.fedora`, `ov.fedora-nonfree`, `ov.fedora-builder`).
#  Nothing in main consumes any image here, so there is NO main → fedora
#  coupling — the only edge is fedora → main.
#
#  import: has two shapes —
#    * flat string  → build.yml (shared distro/builder/init vocabulary), merged
#      into this repo's root namespace.
#    * `ov: <ref>`  → the main overthink repo mounted under the `ov` namespace,
#      so the Fedora base stack (ov.fedora / ov.fedora-nonfree /
#      ov.fedora-builder) resolves. Builder maps do NOT cross a namespace
#      boundary, so each consumer image below declares its own explicit
#      `builder:` map routing the formats it builds to ov.fedora-builder.
#
#  Directly buildable: `ov image build fedora-coder` (the build verb defaults to
#  this overthink.yml). From the parent repo: `ov -C image/fedora image build
#  fedora-coder`, or anywhere: `ov --repo overthinkos/fedora image build
#  fedora-coder`.
version: 2026.156.557
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/overthinkos
    build:
        - rpm
    merge:
        auto: false
        max_mb: 128
import:
    # Shared build-config vocabulary (distro/builder/init) — flat root import.
    # Carries distro.fedora + the rpm format template.
    - '@github.com/overthinkos/overthink/build.yml:v2026.146.0858'
    # Main repo entities under the `ov` namespace — ov.fedora /
    # ov.fedora-nonfree (consumer bases) + ov.fedora-builder (the builder each
    # consumer image routes pixi/npm/cargo to). Only edge is fedora → main.
    - ov: '@github.com/overthinkos/overthink:v2026.146.0858'
    - box.yml
    - pod.yml
    - k8s.yml
eval:
    # Disposable R10 beds (kind: eval, target: pod) — one per fedora consumer
    # image. Ports remapped into the 4xxxx range so a bed run never collides
    # with a production deploy of the same image. `ov eval run <bed>` is the
    # canonical R10 gate: build → eval-image → deploy → eval-live → fresh
    # update → teardown, all on isolated ov-<bed>-* volumes
    # (deployVolumePrefix). `disposable: true` is the sole authorization for
    # the unattended destroy + rebuild.
    eval-fedora-coder-pod:
        target: pod
        box: fedora-coder
        disposable: true
        lifecycle: dev
        port: [auto] # auto-allocate free host ports (avoid fixed-port collisions)
        description:
            feature: R10 bed for the fedora-coder image — sshd + ov-mcp + 5 AI CLIs + DevOps tooling on the Fedora 43 + RPM Fusion base
            tag: [testing]
    eval-fedora-ov-pod:
        target: pod
        box: fedora-ov
        disposable: true
        lifecycle: dev
        port: [auto] # auto-allocate free host ports (avoid fixed-port collisions)
        description:
            feature: R10 bed for the fedora-ov image — minimal ov toolchain + sshd + nvidia on the Fedora base
            tag: [testing]
    eval-fedora-test-pod:
        target: pod
        box: fedora-test
        disposable: true
        lifecycle: dev
        port: [auto] # auto-allocate free host ports (avoid fixed-port collisions)
        description:
            feature: R10 bed for the fedora-test image — traefik + testapi on the Fedora base
            tag: [testing]
