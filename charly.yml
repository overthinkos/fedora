#  overthinkos/fedora — the Fedora image-family, a git submodule mounted at
#  image/fedora. SELF-CONTAINED: it OWNS the full Fedora base stack locally
#  (fedora → fedora-nonfree → fedora-builder), the Fedora GPU base family
#  (nvidia / python-ml), the consumer showcase images (fedora-coder /
#  charly-fedora / fedora-test), the sway-browser-vnc desktop, and every
#  Fedora-rooted app/fixture box — all discovered under box/.
#
#  This repo VENDORS NO CANDIES: every candy is an
#  `@github.com/overthinkos/overthink/candy/<name>:<tag>` ref into the main
#  opencharly repo's shared candy library. Bases resolve to LOCAL boxes by bare
#  name (`base: fedora`, `base: nvidia`); the build vocabulary
#  (distro/builder/init) comes from the charly binary's embedded defaults. There
#  is NO namespace import (`import: []`) — nothing here depends on the main repo
#  except the @github candy refs.
#
#  Directly buildable: `charly box build fedora-coder` (the build verb defaults to
#  this charly.yml). From the parent repo: `charly -C image/fedora image build
#  fedora-coder`, or anywhere: `charly --repo overthinkos/fedora image build
#  fedora-coder`.
version: 2026.160.1301
# Canonical repo identity — lets the import-namespace loader recognize this repo
# when main imports it under the `fedora` namespace to build the relocated boxes.
# The dependency is one-directional: main imports fedora; fedora imports nothing
# back (the former two-way main↔fedora import is dissolved).
repo: github.com/overthinkos/fedora
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/overthinkos
    build:
        - rpm
    merge:
        auto: false
        max_mb: 128
# No namespace import: the fedora base stack is local; candies resolve via @github refs.
import: []
eval:
    # Disposable R10 beds (kind: eval, target: pod) — one per fedora consumer
    # image. Ports remapped into the 4xxxx range so a bed run never collides
    # with a production deploy of the same image. `charly eval run <bed>` is the
    # canonical R10 gate: build → eval-image → deploy → eval-live → fresh
    # update → teardown, all on isolated charly-<bed>-* volumes
    # (deployVolumePrefix). `disposable: true` is the sole authorization for
    # the unattended destroy + rebuild.
    eval-fedora-coder-pod:
        target: pod
        box: fedora-coder
        disposable: true
        lifecycle: dev
        port: [auto] # auto-allocate free host ports (avoid fixed-port collisions)
        description:
            feature: R10 bed for the fedora-coder image — sshd + charly-mcp + 5 AI CLIs + DevOps tooling on the Fedora 43 + RPM Fusion base
            tag: [testing]
    eval-charly-fedora-pod:
        target: pod
        box: charly-fedora
        disposable: true
        lifecycle: dev
        port: [auto] # auto-allocate free host ports (avoid fixed-port collisions)
        description:
            feature: R10 bed for the charly-fedora box — minimal charly toolchain + sshd + nvidia on the Fedora base
            tag: [testing]
    eval-fedora-test-pod:
        target: pod
        box: fedora-test
        disposable: true
        lifecycle: dev
        port: [auto] # auto-allocate free host ports (avoid fixed-port collisions)
        description:
            feature: R10 bed for the fedora-test image — traefik + testapi on the Fedora base
            tag: [testing]
    # eval-sway-browser-vnc-pod deploys the SHIPPING sway-browser-vnc image
    # (Sway desktop + Chrome + wayvnc) on the Fedora base. The image bakes
    # binaries/services/cdp/vnc/wl/dbus + mcp (chrome-devtools-mcp layer); the
    # eval: block adds the remaining deploy-scope probes (operator-side http, cdp
    # list, wl sway-tree, record). Publishes the image's canonical 5900/9222/9224.
    # sway-browser-vnc's canonical home (relocated from the retired
    # overthinkos/selkies submodule; its base is fedora).
    eval-sway-browser-vnc-pod:
        target: pod
        box: sway-browser-vnc
        disposable: true
        lifecycle: dev
        port: [auto] # auto-allocate free host ports (avoid fixed-port collisions)
        eval:
            - http: "http://127.0.0.1:${HOST_PORT:9222}/json/version"
              id: esbv-pod-http-cdp
              scope: deploy
              status: 200
            - cdp: list
              id: esbv-pod-cdp-list
              scope: deploy
            - wl: sway-tree
              id: esbv-pod-wl-sway-tree
              scope: deploy
            - record: start
              id: esbv-pod-record-start
              scope: deploy
              record_name: eval-term
              record_mode: terminal
    # Relocated from main (2026-06 box inversion) with their boxes — bare local
    # box refs (eval-pod / jupyter / jupyter-ml now live under box/ in this
    # submodule). Per-box R10 beds; the cross-deployment mechanism beds
    # (eval-cross-*) stay in main since their driver template does.
    eval-pod:
        target: pod
        box: eval-pod
        disposable: true
        lifecycle: dev
        port: [auto] # auto-allocate free host ports (avoid fixed-port collisions)
        description:
            feature: Combined fast pod bed — kind:image + kind:layer + kind:pod + DeployTarget mechanisms
            tag: [working]
        eval:
            - id: status-shows-pod
              scope: deploy
              command: charly status --json
              in_container: false
              stdout:
                - contains: '"kind": "pod"'
                - contains: eval-pod
    eval-jupyter-pod:
        target: pod
        box: jupyter
        disposable: true
        lifecycle: dev
        port: [auto] # auto-allocate free host ports (avoid fixed-port collisions)
        description:
            feature: R10 bed for jupyter-mcp regression coverage (auto-attach, canonicalization, idle-room sweep, cell_update id-preservation)
            tag: [working]
    eval-jupyter-ml-pod:
        target: pod
        box: jupyter-ml
        disposable: true
        lifecycle: dev
        port: [auto] # auto-allocate free host ports (avoid fixed-port collisions)
        description:
            feature: R10 bed for jupyter-ml — exercises spacy-import, jupyterlab-quarto-enabled build-scope checks plus deploy-scope MCP probes against the GPU-backed image
            tag: [testing]
    # rpm localpkg AUTO-RESOLVE witness on a disposable Fedora Cloud VM. The charly
    # layer's localpkg: builds the opencharly .rpm from the superproject pkg/fedora
    # (rpmbuild in a fedora container on the host) and `dnf install`s it onto the
    # guest — dnf AUTO-RESOLVES the package's mandatory deps from the Fedora repos
    # (incl. tailscale, which IS in the Fedora repos). The witness FAILS if
    # localpkg didn't install the opencharly rpm or dnf didn't auto-resolve the set.
    eval-fedora-vm:
        target: vm
        vm: fedora-vm
        disposable: true
        lifecycle: dev
        add_candy:
            - '@github.com/overthinkos/overthink/candy/charly:v2026.160.2017'
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
            skip_incompatible: true # skip composed layers lacking a guest-format section; the localpkg .deb/.rpm Depends/Requires install the packages
        eval:
            - id: localpkg-rpm-autoresolve
              scope: deploy
              description: charly installed as the opencharly rpm via localpkg, mandatory deps auto-resolved by dnf (incl. tailscale)
              command: |
                rpm -q opencharly >/dev/null 2>&1 &&
                rpm -q podman >/dev/null 2>&1 &&
                rpm -q libvirt >/dev/null 2>&1 &&
                rpm -q tailscale >/dev/null 2>&1 &&
                rpm -q gocryptfs >/dev/null 2>&1 &&
                command -v charly >/dev/null 2>&1 &&
                charly version &&
                echo LOCALPKG-RPM-AUTORESOLVE-OK
              stdout:
                - contains: LOCALPKG-RPM-AUTORESOLVE-OK
              exit_status: 0
vm:
    # Disposable Fedora Cloud VM — the substrate for eval-fedora-vm, which proves
    # the rpm localpkg AUTO-RESOLVE deploy path (build the opencharly .rpm in a
    # fedora container, dnf install onto the guest, mandatory deps auto-resolved).
    fedora-vm:
        source:
            kind: cloud_image
            url: https://download.fedoraproject.org/pub/fedora/linux/releases/43/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-43-1.6.x86_64.qcow2
            checksum:
                type: sha256
            base_user: fedora
        backend: libvirt
        disk_size: 20G
        ram: 4G
        cpu: 2
        machine: q35
        firmware: bios
        ssh:
            port_auto: true
            key_source: generate
        cloud_init:
            timezone: UTC
            package:
                - sudo
pod: {}
k8s: {}
discover:
    - path: box
      recursive: true
    - path: candy
      recursive: true
