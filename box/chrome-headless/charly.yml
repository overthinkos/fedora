box:
    # Headless Chrome CDP driver — the `peer:` instrument that CDP-probes a
    # separate web subject (cross-deployment `charly eval`). See candy/chrome-headless.
    name: chrome-headless
    base: fedora
    candy:
        - '@github.com/overthinkos/overthink/candy/supervisord:v2026.160.2017'
        - '@github.com/overthinkos/overthink/candy/chrome-headless:v2026.160.2017'
    port:
        - 9222:9222
