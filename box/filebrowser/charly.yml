box:
    name: filebrowser
    base: fedora
    candy:
        - '@github.com/overthinkos/overthink/candy/agent-forwarding:v2026.165.2208'
        - '@github.com/overthinkos/overthink/candy/filebrowser:v2026.165.2208'
        - '@github.com/overthinkos/overthink/candy/dbus:v2026.165.2208'
    # No box-level check: the filebrowser + dbus-daemon binaries belong to their
    # candies (filebrowser, dbus), and the `data`-volume probe belongs to
    # candy/filebrowser (which declares the volume) — one candy check covers
    # every box composing them.
