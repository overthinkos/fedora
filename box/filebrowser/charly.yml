box:
    name: filebrowser
    base: fedora
    candy:
        - '@github.com/overthinkos/overthink/candy/agent-forwarding:v2026.162.1355'
        - '@github.com/overthinkos/overthink/candy/filebrowser:v2026.162.1355'
        - '@github.com/overthinkos/overthink/candy/dbus:v2026.162.1355'
    # No box-level eval: the filebrowser + dbus-daemon binaries belong to their
    # candies (filebrowser, dbus), and the `data`-volume probe belongs to
    # candy/filebrowser (which declares the volume) — one candy check covers
    # every box composing them.
