box:
    name: filebrowser
    base: fedora
    candy:
        - '@github.com/overthinkos/overthink/candy/agent-forwarding:v2026.162.0847'
        - '@github.com/overthinkos/overthink/candy/filebrowser:v2026.162.0847'
        - '@github.com/overthinkos/overthink/candy/dbus:v2026.162.0847'
    eval:
        - command: test -x /usr/local/bin/filebrowser && test -x /usr/bin/dbus-daemon
          id: filebrowser-composed-binaries
          exit_status: 0
        - file: ${VOLUME_CONTAINER_PATH:data}
          id: filebrowser-volumes-exist
          scope: deploy
          filetype: directory
