box:
    name: jupyter
    base: fedora
    candy:
        - '@github.com/overthinkos/overthink/candy/agent-forwarding:v2026.162.1355'
        - '@github.com/overthinkos/overthink/candy/jupyter:v2026.162.1355'
        - '@github.com/overthinkos/overthink/candy/notebook-templates:v2026.162.1355'
        - '@github.com/overthinkos/overthink/candy/dbus:v2026.162.1355'
    # No box-level check: the .ipynb-templates-provisioned probe lives on
    # candy/notebook-templates (notebook-templates-present, covering all 5 boxes
    # composing it), and the jupyter_mcp extension is covered by candy/jupyter-mcp
    # (jupyter-mcp-config-enabled) + candy/jupyter's deploy-scope mcp-* probes.
