box:
    name: jupyter
    base: fedora
    candy:
        - '@github.com/overthinkos/overthink/candy/agent-forwarding:v2026.162.0847'
        - '@github.com/overthinkos/overthink/candy/jupyter:v2026.162.0847'
        - '@github.com/overthinkos/overthink/candy/notebook-templates:v2026.162.0847'
        - '@github.com/overthinkos/overthink/candy/dbus:v2026.162.0847'
    eval:
        - command: find /workspace -maxdepth 3 -name "*.ipynb" | head -n 1
          id: jupyter-notebook-templates-provisioned
          scope: deploy
          in_container: true
          exit_status: 0
          stdout:
            - matches: \.ipynb
        - command: ${HOME}/.pixi/envs/default/bin/jupyter server extension list 2>&1 | grep -i jupyter_mcp
          id: jupyter-mcp-extension-enabled
          exit_status: 0
