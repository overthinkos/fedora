hermes:
    candy:
        base: fedora
    hermes-candy:
        candy:
            - '@github.com/overthinkos/overthink/candy/agent-forwarding:v2026.174.0425'
            - '@github.com/overthinkos/overthink/candy/hermes-full:v2026.174.0425'
            - '@github.com/overthinkos/overthink/candy/dbus:v2026.174.0425'
        # No box-level check: the claude/codex/gemini CLIs and the hermes binary +
        # service belong to their candies' check (claude-code/codex/gemini via
        # hermes-full, and hermes' own hermes-binary/hermes-service-running) — one
        # candy check covers every box composing them.
