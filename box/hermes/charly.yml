box:
    name: hermes
    base: fedora
    candy:
        - '@github.com/overthinkos/overthink/candy/agent-forwarding:v2026.164.1529'
        - '@github.com/overthinkos/overthink/candy/hermes-full:v2026.164.1529'
        - '@github.com/overthinkos/overthink/candy/dbus:v2026.164.1529'
    # No box-level check: the claude/codex/gemini CLIs and the hermes binary +
