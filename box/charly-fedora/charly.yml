box:
    name: charly-fedora
    base: fedora
    # Builder maps do NOT cross the `charly` namespace boundary; route the
    # standard build formats to main's fedora-builder under the `charly`
    # namespace so any pixi/npm/cargo layer added here resolves.
    builder:
        pixi: fedora-builder
        npm: fedora-builder
        cargo: fedora-builder
    candy:
        - '@github.com/overthinkos/overthink/candy/agent-forwarding:v2026.165.0934'
        - '@github.com/overthinkos/overthink/candy/supervisord:v2026.165.0934'
        - '@github.com/overthinkos/overthink/candy/charly:v2026.165.0934'
        - '@github.com/overthinkos/overthink/candy/golang:v2026.165.0934'
        - '@github.com/overthinkos/overthink/candy/gh:v2026.165.0934'
        - '@github.com/overthinkos/overthink/candy/sshd:v2026.165.0934'
        - '@github.com/overthinkos/overthink/candy/container-nesting:v2026.165.0934'
        - '@github.com/overthinkos/overthink/candy/nvidia:v2026.165.0934'
